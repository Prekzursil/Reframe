name: e2e

# OPT-IN autonomous end-to-end suite. This NEVER gates a normal PR — it is the
# heavy companion to `quality.yml`. It installs the heavier runtime deps that the
# standard gate deliberately omits (no-heavy-ML rule) and runs the real-pipeline
# / real-ffmpeg / mock-model flows that are excluded from the default gate:
#   * sidecar  : pytest -m e2e            (the `e2e`-marked AI2 hub/director +
#                                          intel/repurpose + NASTY-INPUT real-media
#                                          tests)
#   * sidecar  : real_pipeline_smoke.py   (standalone real-ffmpeg + tiny-whisper
#                                          short-making pipeline)
#   * app      : npm run test:e2e         (Playwright Electron GUI E2E — preview +
#                                          PACKAGED `app.isPackaged` proof + the
#                                          golden Make-Shorts journey + the
#                                          SPEECH-to-caption journey, which is
#                                          WINDOWS-ONLY and self-skips loudly
#                                          elsewhere — it synthesises its own
#                                          speech with Windows SAPI, see
#                                          app/e2e/transcribe-journey.spec.ts)
#   * app      : npm run test:e2e:dom     (vitest DOM caption-over-video + nasty-
#                                          caption proofs)
#   * app      : npm run test:e2e:visual  (Wave-2b VISUAL screenshot-diff +
#                                          A11Y/axe + keyboard/focus/reduced-motion;
#                                          WINDOWS-ONLY — baselines are `*-win32.png`)
#
# OS MATRIX (WU-A): the GUI E2E runs on windows-latest, macos-latest, macos-13,
# and ubuntu-latest. On Windows the leg BUILDS the real electron-builder package
# and drives the SHIPPED .exe (packaged.spec.ts asserts app.isPackaged === true);
# the packaged artifact is Windows-only (electron-builder.yml has a `win:` target
# and the embeddable-CPython/ffmpeg staging in build/python-embed-setup.ps1 is
# PowerShell/Windows-only), so the macOS/Linux legs run the SAME specs against the
# dev build (RF_E2E_DEV=1); packaged.spec.ts self-skips off-Windows. xvfb-run is
# Linux-only (Windows/macOS run the Electron window natively).
#
# Triggered ONLY on demand (workflow_dispatch) or on the nightly schedule, so the
# default `quality.yml` gate (100% coverage, heavy-ML-free) is untouched.

on:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Regenerate the Windows (*-win32.png) visual baselines instead of diffing (uploads them as the 'updated-visual-baselines' artifact; does NOT commit)"
        type: boolean
        default: false
      drive_installed_build:
        description: "Windows only: silently INSTALL the built NSIS package and drive installed-app.spec.ts against it (cold first-run bootstrap + data pipeline), then uninstall. Slow (multi-minute bootstrap, network) — off by default and NEVER on the nightly schedule."
        type: boolean
        default: false
  schedule:
    # Nightly at 04:17 UTC (off the hour to avoid GitHub's scheduler congestion).
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-sidecar:
    name: e2e-sidecar (real pipeline + AI/nasty markers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install sidecar + E2E runtime deps (CPU)
        run: |
          python -m pip install --upgrade pip
          # hypothesis is imported by sidecar/tests/conftest.py at collection time
          # (it registers the deterministic "ci" profile), so EVERY pytest run —
          # including `pytest -m e2e` — needs it. `sidecar[dev]` declares it, but the
          # `--no-deps` install below skips the extra's transitives, so install the
          # test tools explicitly here.
          pip install pytest pytest-cov hypothesis
          # Package itself (pure-logic modules) + dev extras, no heavy transitives.
          pip install -e "sidecar[dev]" --no-deps
          # The CPU runtime deps the opt-in E2E flows actually exercise. Unlike the
          # standard gate, the E2E suite IS allowed the heavier (still CPU-only)
          # stack: real tiny faster-whisper, scenedetect, av, onnxruntime, cv2.
          # opencv is PINNED to the version the reframe engine is validated against
          # (pyproject reframe-gpu extra, A6 lesson 5). Unpinned resolves to OpenCV
          # 5.x, whose cv2.FaceDetectorYN/YuNet path is a major-version break and
          # fails the claudeshorts reframe.
          pip install \
            httpx numpy opencv-python-headless==4.13.0.92 \
            faster-whisper scenedetect av onnxruntime \
            huggingface_hub tokenizers

      - name: E2E sidecar — pytest -m e2e (AI2 hub/director + intel/repurpose + nasty inputs)
        working-directory: sidecar
        env:
          # sidecar/tests/conftest.py installs the hermetic egress guard
          # (tests/_hermetic.py) for EVERY pytest invocation, including this one.
          # That guard exists to keep the BLOCKING gate (quality.yml) independent
          # of third-party endpoints — the get-pip.py rotation took main red twice.
          # This opt-in suite is the opposite contract by design: it is the heavy
          # leg that is ALLOWED real fetches (it installs huggingface_hub +
          # faster-whisper precisely so the reframe/ASD flows can provision real
          # model weights). Blocking egress here would be a scope error, not
          # hardening, so the guard is explicitly stood down for this step only.
          REFRAME_ALLOW_EGRESS: "1"
        run: python -m pytest -m e2e -v

      - name: E2E sidecar — real short-making pipeline smoke (real ffmpeg + tiny whisper)
        run: |
          mkdir -p e2e_artifacts
          # A short sample clip (no speech → tiny whisper honestly returns 0
          # segments; the script reports that explicitly, see the e2e README).
          ffmpeg -y -f lavfi -i testsrc=size=640x360:rate=30:duration=8 \
                 -f lavfi -i sine=frequency=440:duration=8 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
                 e2e_artifacts/sample.mp4
          export PYTHONPATH="$PWD/sidecar"
          python sidecar/tests/e2e/real_pipeline_smoke.py \
            --sample e2e_artifacts/sample.mp4 \
            --workdir e2e_artifacts/run \
            --repo "$PWD"

      - name: Upload sidecar E2E artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-sidecar-artifacts
          path: e2e_artifacts/
          if-no-files-found: ignore
          retention-days: 7

  e2e-gui:
    name: e2e-gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red OS leg must NOT cancel the others — we want the full OS picture.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # electron-builder must never try to discover/notarize a signing identity
      # in CI (it would hang on macOS); this app is unsigned (electron-builder.yml).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"

      # ffmpeg is needed on EVERY OS (the fixtures generate the real sample clip).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install sidecar (stdlib preview path — no ML deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar[dev]" --no-deps

      - name: Install the reframe + asset-provisioning runtime deps for the real Make-Shorts pipeline
        # golden-journey.spec.ts drives the REAL reframe→export pipeline against the
        # dev-build sidecar (RF_PY = this system python on EVERY leg, incl. Windows —
        # only packaged.spec drives the shipped .exe). Two runtime needs the
        # `sidecar[dev] --no-deps` install above deliberately omits:
        #  * cv2 — the final vertical-reframe stage (reframe_claudeshorts) HARD-requires
        #    it and fails LOUD when missing (no silent center-crop — the WU-3 contract).
        #    PINNED to the reframe-validated version (pyproject reframe-gpu extra, A6
        #    lesson 5); unpinned resolves to OpenCV 5.x, a FaceDetectorYN/YuNet
        #    major-version break. opencv-python-headless bundles FaceDetectorYN + the
        #    ONNX runtime YuNet uses (no GUI libs); numpy rides along.
        #  * httpx — the asset downloader (manager._default_http_client) lazily imports
        #    it. golden-journey provisions the YuNet model via a live sidecar
        #    (fixtures.provisionAssets → assets.ensure); WITHOUT httpx that download
        #    throws, assets.ensure GRACEFULLY SKIPS the item but still emits job.done,
        #    so YuNet never lands and the reframe reports "not provisioned". huggingface_hub
        #    covers the HF-snapshot install path for completeness.
        # In production the packaged app installs these on first-run bootstrap. Mirrors
        # the e2e-sidecar job's install.
        run: pip install "opencv-python-headless==4.13.0.92" numpy httpx huggingface_hub

      # --- WINDOWS ONLY: the ASR runtime for the speech-to-caption journey. ---
      # transcribe-journey.spec.ts drives the REAL `transcribe.start` through the
      # GUI, so the sidecar must be able to load a whisper model. The
      # `sidecar[dev] --no-deps` install above deliberately omits faster-whisper,
      # and WITHOUT it the transcribe job dies with ModuleNotFoundError — which the
      # spec would surface as a named UI error, but a named error is still a red
      # leg, not a proof.
      #
      # WINDOWS-ONLY because the spec is: its speech fixture synthesises audio with
      # Windows SAPI (`System.Speech.Synthesis.SpeechSynthesizer`) and `test.skip()`s
      # loudly on the macOS/Linux legs. Installing ~200 MB of ctranslate2 /
      # onnxruntime / tokenizers wheels for a spec that skips would be pure cost.
      #
      # PINNED to `sidecar/requirements.lock.txt` (== what the shipped app runs),
      # TRANSITIVES INCLUDED, per A6 lesson 5 — deliberately unlike the e2e-sidecar
      # job's unpinned `faster-whisper`, so a new upstream release cannot silently
      # change this nightly's ASR behaviour.
      #
      # REFUTED WORDING, recorded so it cannot be reintroduced: this comment used
      # to claim faster-whisper's "own pinned transitives (ctranslate2 4.8.1 /
      # tokenizers 0.23.1 / onnxruntime 1.28.0 / av 17.1.0) come along as declared
      # dependencies". faster-whisper 1.2.1 pins NOTHING. MEASURED with
      # `importlib.metadata.requires('faster-whisper')`: `ctranslate2<5,>=4.0`,
      # `onnxruntime<2,>=1.14`, `tokenizers<1,>=0.13`, `av>=11` — all open ranges.
      # And a bare `pip install "faster-whisper==1.2.1"` on this box resolved
      # av 18.0.0 + numpy 2.5.2 against lock `av==17.1.0` (:17) and `numpy==2.5.1`
      # (:107). So the reproducibility rationale was false exactly where it
      # mattered: ctranslate2 IS the inference engine and onnxruntime IS the VAD
      # runtime, and both floated freely inside their major bounds.
      #
      # `--constraint` makes that original claim TRUE rather than merely rewording
      # it. MEASURED in a fresh venv (Windows, CPython 3.12) — every transitive
      # lands lock-exact: faster-whisper 1.2.1 · ctranslate2 4.8.1 · tokenizers
      # 0.23.1 · onnxruntime 1.28.0 · av 17.1.0 · numpy 2.5.1 · huggingface-hub
      # 1.26.0 · tqdm 4.70.0, pip exit 0. `--constraint` and not `-r <lock>`
      # because `-r` would install the WHOLE sidecar runtime and would fight the
      # deliberate `opencv-python-headless==4.13.0.92` pin above (the lock carries
      # `opencv-python==4.14.0.94`, a different distribution); a constraint only
      # bounds packages already in faster-whisper's own resolution closure. The
      # lock is constraint-safe: plain `==` lines plus pip-compile `# via`
      # comments, and zero URLs / hashes / extras (which pip rejects in a
      # constraints file).
      # UNVERIFIED on a GitHub runner (measured here on the same OS family and the
      # same CPython minor, so the wheel set should match — likely, 80%); the
      # settling experiment is the next nightly, whose pip log prints every
      # resolved version.
      #
      # NO `assets.ensure` step, on purpose. The spec pins whisper `tiny` via the
      # real `settings.set`, and `tiny` is NOT a registered manifest asset — so
      # `transcribe.resolve_model_source` hands faster-whisper the bare id and it
      # fetches the ~75 MB snapshot from huggingface.co at run time. MEASURED
      # alternative: provisioning the registered Default-profile asset instead
      # (`whisper-large-v3-turbo`) is 1546.5 MB. This leg therefore carries the SAME
      # network dependency the e2e-sidecar job's real_pipeline_smoke.py already has,
      # and is NOT an offline proof.
      - name: Install the ASR runtime for the speech-to-caption journey (Windows only)
        if: runner.os == 'Windows'
        run: pip install "faster-whisper==1.2.1" --constraint sidecar/requirements.lock.txt

      - name: Install app deps
        working-directory: app
        run: npm ci

      - name: Install render-cli deps
        working-directory: app/render-cli
        run: npm ci

      - name: Install Playwright browsers + OS deps
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Build app (electron-vite + remotion bundle)
        working-directory: app
        run: npm run build

      - name: Type-check the E2E harness
        working-directory: app
        run: npm run typecheck:e2e

      # --- Windows ONLY: stage the embeddable runtime + build the real package, so
      # the GUI E2E drives the SHIPPED .exe (packaged.spec.ts asserts isPackaged). ---
      - name: Stage packaged runtime (embeddable CPython + ffmpeg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/python-embed-setup.ps1 -WithFfmpeg

      - name: Package the Windows app (electron-builder → dist/)
        if: runner.os == 'Windows'
        working-directory: app
        # `--publish never`: this is an E2E BUILD, not a release. Without it,
        # electron-builder detects CI and implicitly tries to publish, which
        # fails with "GitHub Personal Access Token is not set" (no GH_TOKEN) —
        # AFTER it has already built + signed dist/. We only need dist/ to exist
        # for packaged.spec.ts to drive the shipped .exe; publishing is the
        # release workflow's job, not this gate's.
        run: npx electron-builder --config ../electron-builder.yml --win --publish never

      # --- ANTI-RECURRENCE: does the ffmpeg we just PACKAGED actually work? ---
      # v1.4 shipped a bundled ffmpeg (BtbN win64-LGPL, --disable-libx264
      # --disable-libx265) that cannot encode H.264, while the sidecar hardcodes
      # the literal token "libx264" at 13 sites across 9 modules. Every export on
      # the shipped product died with "Unknown encoder 'libx264'", and CI stayed
      # green the whole time because every ffmpeg-consuming step above installs
      # ffmpeg from apt/choco — a GPL build that HAS libx264. The gates measured a
      # binary the user never runs.
      #
      # This step probes the binary electron-builder just staged into the package
      # (resources/bin — the exact path the packaged main wires MEDIA_STUDIO_FFMPEG
      # to) and fails the leg if it cannot encode what the code demands. It runs
      # BEFORE the Playwright specs because it is seconds-fast and its failure
      # explains every downstream export failure at once.
      #
      # Not a 7th quality gate: e2e.yml is the dispatch/nightly workflow, so the
      # closed 6-gate charter (QUALITY-CHARTER.md rule 2) is untouched.
      - name: Verify the PACKAGED ffmpeg can encode what the pipeline hardcodes
        if: runner.os == 'Windows'
        working-directory: sidecar
        shell: pwsh
        # Single line on purpose: a PowerShell backtick continuation breaks on any
        # trailing whitespace, and a CI step is a bad place to discover that.
        run: python -m media_studio.encoders --ffmpeg "$env:GITHUB_WORKSPACE/dist/win-unpacked/resources/bin/ffmpeg.exe"

      - name: E2E GUI — vitest DOM caption + nasty-caption proofs
        working-directory: app
        run: npm run test:e2e:dom

      # The GUI Playwright E2E: on Windows preview.spec drives the packaged .exe
      # (dist/ exists) and packaged.spec asserts isPackaged===true; elsewhere
      # RF_E2E_DEV forces the dev build and packaged.spec self-skips.
      - name: E2E GUI — Playwright Electron (Linux, xvfb)
        if: runner.os == 'Linux'
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: E2E GUI — Playwright Electron (macOS dev build)
        if: runner.os == 'macOS'
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: npm run test:e2e

      # Windows runs BOTH specs in one invocation: packaged.spec ALWAYS drives the
      # real shipped .exe (it self-forces RF_E2E_REQUIRE_PACKAGED, ignoring
      # RF_E2E_DEV) to prove isPackaged===true / asar / no-console-error + that the
      # .exe wires its first-run bootstrap. preview.spec's DATA-PIPELINE assertions
      # (seeded library / playback / export) run against the dev build because a
      # COLD packaged launch pip-installs the heavy sidecar runtime on first run
      # (multi-minute, network) and cannot answer RPCs inside a CI window — a
      # documented packaged-runtime limitation, not a regression (see app/e2e/README).
      #
      # transcribe-journey.spec (speech -> transcript -> caption) is EXCLUDED here
      # and runs in its OWN step AFTER the visual+a11y suite below. Why: a red
      # Playwright step makes every LATER step inherit GitHub's implicit success()
      # gate, and the BLOCKING visual/a11y diff step below deliberately does NOT
      # carry always() (it must stay a real gate — see the comment there). This repo
      # has already MEASURED that cascade on run 30612141716. A separate spec FILE
      # is not separate CI exposure: playwright.config.ts testMatch is
      # '**/*.spec.ts', so the new spec would otherwise join THIS one invocation —
      # and by its own account it is the most fragile member (it needs an `en-*`
      # SAPI voice on the runner and huggingface.co egress, both UNVERIFIED on a
      # GitHub image), so its first red would silently drop visual+a11y coverage.
      # Excluding it here keeps the pre-existing gate order intact and costs nothing.
      #
      # add-videos-dialog.spec.ts is ALSO excluded here and runs in its own step
      # after transcribe-journey (v1.5 e2e-coverage lane; corrected 2026-08-11).
      # The original wiring put it in THIS invocation on the reasoning quoted below
      # for `installed-app` — "a spec that cannot fail cannot start the suppression
      # cascade". That reasoning is sound for `installed-app`, which self-skips, and
      # it does NOT transfer: add-videos-dialog CAN fail. MEASURED with
      # `--list`: it sorted FIRST of the 8 files, so it ran ahead of `packaged`,
      # `preview` and the proven `golden-journey`. It is also not cheap — it launches
      # its own Electron app plus a COLD sidecar, and its beforeAll wait had to be
      # raised to 60 s above the config's 30 s expect.timeout because a cold sidecar
      # boot measurably exceeded 30 s on a loaded box.
      #
      # HOW THE EXCLUSION IS SPELLED, and why not a regex alternation. A second name
      # cannot be added to `--grep-invert` on this platform. MEASURED, both forms:
      #   * `--grep-invert "transcribe-journey|add-videos-dialog"` -> the `|` is
      #     eaten by the shell npm spawns: `'add-videos-dialog' is not recognized as
      #     an internal or external command`, exit 255. Single-quoting does not help.
      #   * two `--grep-invert` flags -> Playwright honours only the LAST one:
      #     `--list` still enumerated the transcribe-journey tests, 32 in 7 files.
      # So this step now names the files it DOES run. Bare args are Playwright
      # filename filters and carry no shell metacharacters.
      #
      # DETECTOR CONTROL (re-measured on this box, not adjusted by arithmetic):
      #   `--list` alone                       -> 37 tests in 8 files
      #   `--grep-invert transcribe-journey`   -> 35 tests in 7 files
      #   the positive list below              -> 30 tests in 6 files
      #     confirm-scrim 5 · golden-journey 2 · installed-app 5 · overlay-hittest 4
      #     · packaged 5 · preview 9
      #   `--list add-videos-dialog`           ->  5 tests in 1 file
      # TRIPWIRE, and it points the opposite way to the old one: a NEW spec file is
      # not picked up here unless it is added to this list. That fails SAFE (it is
      # simply not run in this step) rather than restoring the cascade, and the
      # `!cancelled()` on the visual gate below means a missing name can no longer
      # suppress anything either way. Renaming one of these six makes this step's
      # count drop — compare against the numbers above.
      #
      # `installed-app` stays IN this invocation deliberately: it self-skips unless
      # RF_E2E_APP_EXE is set, which now happens ONLY inside its own dedicated step
      # (a step-scoped `env:`, no longer job-wide), so here it reports 5 skips and
      # cannot go red.
      # The macOS/Linux legs above need no exclusion: transcribe-journey self-skips
      # there with a named reason (Windows SAPI). add-videos-dialog DOES run on those
      # legs and has never been observed green there — UNVERIFIED; settling
      # experiment is the next nightly's macOS/Linux logs. It cannot cascade there:
      # every step after those two legs is either Windows-gated or carries always().
      #
      # `!cancelled()` added 2026-08-11 for the same reason as the other three Windows
      # gates. This is the LARGEST of them — confirm-scrim, golden-journey,
      # overlay-hittest, packaged, preview — and it was bare, so a red in the vitest
      # DOM step above silently skipped the whole packaged suite. It was missed by
      # reading the previous audit's prose; a mechanical re-audit of every step's
      # guard (yaml.safe_load, not eyeballing) is what surfaced it. Accepted
      # trade-off, and the one the VISUAL gate already accepts: if PACKAGING fails
      # this now attempts to run and fails a second time, rather than reporting a
      # clean `skipped` over a suite nobody ran. The leg is red either way and the
      # packaging error is still the first failure in the log.
      - name: E2E GUI — Playwright Electron (Windows packaged .exe + dev-build pipeline)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: >-
          npm run test:e2e --
          confirm-scrim golden-journey overlay-hittest packaged preview installed-app

      # WAVE-2b VISUAL + A11Y — Windows ONLY. The visual screenshot baselines are
      # platform-specific (committed as `*-win32.png`), so this suite runs on the
      # SINGLE OS its baselines were generated for; the 4-OS e2e-gui matrix's other
      # legs skip it (a missing snapshot would hard-fail a non-baselined OS). The
      # a11y/keyboard checks are DOM-based and OS-independent but ride this same
      # Windows leg to reuse the already-built dev app. Runs against the dev build
      # (RF_E2E_DEV=1) — the same target the baselines were captured against.
      - name: E2E GUI — VISUAL screenshot-diff + A11Y (axe) [Windows only]
        # Normal (blocking) path: diff against the committed `*-win32.png` baselines.
        # Unchanged for the nightly schedule and any dispatch that leaves the
        # `update_visual_baselines` box unchecked (input is '' on schedule, 'false'
        # when unchecked — either way not 'true', so this diff run fires as before).
        #
        # `!cancelled()` ADDED 2026-08-11, and it is the ROOT fix for the suppression
        # cascade this file documents at length. Without it this step inherits
        # GitHub's implicit success() gate, so ANY red in the Playwright step above
        # SILENTLY SKIPS the whole blocking visual+a11y suite — on the only OS that
        # has baselines. Measured on run 30612141716. Every mitigation until now was
        # per-spec (pull transcribe-journey into its own later step; keep fragile
        # specs out of the shared invocation), which means each newly added spec had
        # to re-earn the reasoning — and the v1.5 lane got it wrong for
        # add-videos-dialog by transferring an argument that only held for a spec
        # that self-skips.
        #
        # This does NOT weaken the gate, which is the objection to answer since the
        # comment below deliberately withholds always() from this step: `!cancelled()`
        # changes only WHETHER IT RUNS after an unrelated red — it still runs, still
        # diffs against the committed baselines, and still fails the leg on a
        # mismatch (no continue-on-error). It is the same argument, and the same
        # spelling, this file already applies to the installed-build steps below:
        # silently skipping an explicitly-requested check because something earlier
        # failed is the "looks like it ran" trap. always() is still NOT used, so a
        # cancelled run cannot start a screenshot suite.
        #
        # Accepted cost, stated because it is real: when an earlier step failed
        # because the app itself is broken, this suite will now also run and produce
        # a wall of diff noise. A noisy real gate beats a silent skipped one.
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event.inputs.update_visual_baselines != 'true' }}
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: npm run test:e2e:visual

      # On-demand baseline REGEN: only when the workflow_dispatch box is checked.
      # `--update-snapshots` REWRITES the `*-win32.png` baselines in-place (Playwright
      # exits 0 after writing), so this run is non-blocking by design; the regenerated
      # PNGs are uploaded below for the maintainer to download + commit. Never runs on
      # the schedule (input is '' there), so the nightly gate stays a real diff.
      # `always()` is load-bearing and was MISSING: without it this step inherits the
      # implicit "all previous steps succeeded" gate, so any failure in the Playwright
      # step above SKIPS the regen — while the upload step below already carries
      # `always()` and therefore uploads the OLD baselines under the name
      # `updated-visual-baselines`. That is worse than no artifact: it looks like a
      # successful regen. Measured on run 30612141716: the Playwright step failed on
      # golden-journey's beforeAll, so a dispatch with the box checked could not have
      # produced a new baseline no matter how many times it was re-run.
      #
      # A baseline REGEN is an explicitly-requested maintainer action, not a gate, and
      # `--update-snapshots` makes Playwright exit 0 after writing — so running it
      # regardless of an unrelated earlier failure is correct. The BLOCKING diff path
      # at the step above deliberately does NOT get `always()`; it must stay a real gate.
      - name: E2E GUI — VISUAL baseline REGEN (--update-snapshots) [Windows only, on demand]
        if: always() && runner.os == 'Windows' && github.event.inputs.update_visual_baselines == 'true'
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: npm run test:e2e:visual:update

      # SPEECH -> TRANSCRIPT -> CAPTION, deliberately after the visual/a11y gate.
      # It runs on Windows only (its fixture synthesises speech with Windows SAPI;
      # the macOS/Linux legs self-skip it loudly), on the dev build, whose sidecar is
      # the system python the ASR step above installed faster-whisper into.
      #
      # Placed after the visual/a11y gate ON PURPOSE: this is the leg with the most
      # environmental dependencies (an `en-*` SAPI voice on the image, huggingface.co
      # reachable for the 74.6 MB `tiny` snapshot), so if anything here goes red it
      # must not be able to skip a suite that would otherwise have run.
      #
      # CORRECTED 2026-08-11. This comment used to end "Everything after this point
      # carries always() or !cancelled(), so a red here suppresses no artifact." That
      # was FALSE when written: the very next step (the W40 gate below) carried
      # neither, so a red HERE skipped it. Worse, this step itself carried a bare
      # `if: runner.os == 'Windows'`, which inherits GitHub's implicit success(), so a
      # red in the VISUAL gate above skipped BOTH. Measured on Actions run
      # 31445248586: the visual gate failed on one screenshot and steps 25 and 26 —
      # this step and the W40 gate — both reported `skipped`. The "root fix" the
      # previous commit claimed had been applied to exactly ONE of the three Windows
      # test-gate steps.
      #
      # `!cancelled()` here does NOT weaken the gate: there is no continue-on-error,
      # so a red still fails the leg. It only stops an EARLIER red from silently
      # deciding that this suite never runs. Same argument the visual gate already
      # makes for itself.
      - name: E2E GUI — Playwright Electron (speech -> transcript -> caption) [Windows only]
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: npx playwright test --config playwright.config.ts transcribe-journey

      # NATIVE "Add videos" DIALOG (W40) — its own step, after the visual gate.
      #
      # Excluded from the shared Windows invocation above (see the detector control
      # there). Two independent reasons, and neither is the cascade — the cascade is
      # handled by `!cancelled()` on each of the three Windows test-gate steps (the
      # visual gate, transcribe-journey above, and this one). CORRECTED 2026-08-11:
      # this sentence used to say the cascade was "handled at the root by
      # `!cancelled()` on the visual gate", singular, which was the whole defect —
      # one of three steps was guarded, so a red in the visual gate skipped the other
      # two. Measured on run 31445248586, where both showed `skipped`.
      #   * it sorted FIRST of the 8 spec files, so in the shared invocation it ran
      #     ahead of `packaged`, `preview` and the proven `golden-journey`, putting
      #     the newest and least-observed spec in front of the ones the nightly is
      #     actually relied on for;
      #   * it launches its own Electron app plus a COLD sidecar and needs a 60 s
      #     beforeAll wait (above the config's 30 s expect.timeout) because a cold
      #     sidecar boot measurably exceeded 30 s on a loaded box.
      # Sitting here it is bounded by its own step: a red fails the leg (correct — it
      # IS the W40 proof) and, because it is after both the visual gate and
      # transcribe-journey, it cannot skip anything that has not already run.
      #
      # AFTER transcribe-journey rather than before it, deliberately: everything from
      # this point on carries always() or !cancelled(), so a red here suppresses
      # nothing. Placing it BEFORE transcribe-journey would have made a red here skip
      # that step, which is exactly the trap being closed.
      #
      # NO always(): this IS the W40 gate for the nightly. `!cancelled()` is not
      # always() — a red here still fails the leg; it only stops an earlier red from
      # deciding this gate never runs, which is precisely what happened on run
      # 31445248586.
      - name: E2E GUI — Playwright Electron (native "Add videos" dialog, W40) [Windows only]
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
        run: npx playwright test --config playwright.config.ts add-videos-dialog

      # ── THE INSTALLED BUILD (W-A) + THE COLD PACKAGED PIPELINE (W41) ──────────
      # OPT-IN, WINDOWS-ONLY, workflow_dispatch ONLY (`github.event.inputs` is '' on
      # a schedule, so the nightly can never trigger this).
      #
      # WHY IT EXISTS. Everything above that calls itself "packaged" drives
      # `dist/win-unpacked` — the electron-builder OUTPUT tree. No leg has ever
      # driven an app laid down by the NSIS INSTALLER, and no leg has ever seen the
      # cold packaged first-run bootstrap COMPLETE: `packaged.spec.ts` proves the
      # gate FIRES and then stops, because that bootstrap pip-installs the heavy
      # sidecar runtime into <configDir>/envs/sidecar (multi-minute, network-bound)
      # and cannot finish inside a normal test window. A first-run bootstrap failure
      # on a real machine is therefore the failure class NOTHING observes.
      #
      # WHY IT IS OFF BY DEFAULT. It is slow by construction (a real pip install of
      # the sidecar runtime) and network-dependent, i.e. exactly the profile that
      # must not be added to a gate other people rely on.
      #
      # NOT A 7th QUALITY GATE: e2e.yml is the dispatch/nightly workflow, so the
      # closed 6-gate charter (QUALITY-CHARTER.md rule 2, enforced both ways by
      # .quality/charter_check.py over quality.yml) is untouched.
      #
      # PLACEMENT is load-bearing, same reasoning as the transcribe step above: this
      # is the most environment-dependent leg in the file, so it sits AFTER the
      # blocking visual/a11y gate (which deliberately has no always()) and after
      # transcribe-journey. Everything after it already carries always(), so its red
      # suppresses no artifact.
      #
      # `!cancelled()` rather than the plain implicit success() gate: this is an
      # explicitly-requested maintainer action, and silently SKIPPING it because an
      # unrelated earlier step failed is the "looks like it ran" trap the baseline
      # REGEN step above documents. It is NOT `always()` — a cancelled run must not
      # start a multi-minute install. A red here still fails the leg (no
      # continue-on-error), which is correct: it IS the proof being asked for.
      - name: Install the built package SILENTLY (NSIS /S) [Windows, on demand]
        id: install-app
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event.inputs.drive_installed_build == 'true' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*-win-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            # FAIL CLOSED with the directory listing. Reaching here means the
            # electron-builder step above did not produce an NSIS artifact; a
            # confusing "file not found" from Start-Process would hide that.
            Write-Host "dist contains: $((Get-ChildItem -Path dist -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"
            throw "FAILED:installed-build no *-win-x64.exe NSIS installer in dist/"
          }
          # NSIS: /S = silent, and /D= must be the LAST argument and unquoted (NSIS
          # takes the rest of the command line verbatim). RUNNER_TEMP has no spaces
          # on the GitHub Windows image, which is why no quoting is attempted.
          $target = Join-Path $env:RUNNER_TEMP 'ReframeInstalled'
          Write-Host "installing $($installer.Name) -> $target"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait
          # `-Wait` is not sufficient on its own: an NSIS bootstrapper can hand off
          # to a child process and return early, so poll for the postcondition (the
          # executable on disk) instead of trusting the exit. Bounded, and fails
          # closed with the install-dir listing.
          $exe = Join-Path $target 'Reframe.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "install dir contains: $((Get-ChildItem -Path $target -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"
            throw "FAILED:installed-build silent install produced no $exe"
          }
          Write-Host "installed tree: $((Get-ChildItem -Path $target | ForEach-Object Name) -join ', ')"
          # SECOND INDEPENDENT SIGNAL that this is a real NSIS install and not a
          # copied `win-unpacked` tree: the uninstaller electron-builder's
          # `nsis.oneClick: false` writes beside the app ("Uninstall <productName>.exe";
          # productName is `Reframe`, electron-builder.yml:25,159).
          # This used to be Write-Host ONLY, under a comment claiming "two independent
          # signals". It asserted nothing — a missing uninstaller produced no failure
          # anywhere, and the uninstall step below likewise logs "no uninstaller found"
          # and exits 0. A second signal that cannot go red is indistinguishable from a
          # no-op, so it is now a throw.
          $uninstaller = Get-ChildItem -Path $target -Filter 'Uninstall *.exe' -File | Select-Object -First 1
          if (-not $uninstaller) {
            throw "FAILED:installed-build no NSIS 'Uninstall *.exe' beside $exe — this tree was not laid down by the installer (a copied win-unpacked tree looks like this)"
          }
          Write-Host "uninstaller present: $($uninstaller.Name)"
          # STEP-SCOPED, not job-wide. `$GITHUB_ENV` would export RF_E2E_APP_EXE to
          # EVERY LATER STEP in the job, and `findBuiltApp()` gives it precedence over
          # both RF_E2E_DEV and dist/ for EVERY spec — so any Playwright step added
          # after this one would silently retarget to the installed app (preview.spec's
          # data-pipeline assertions run against the dev build on purpose, and
          # visual/_visualSetup's `launchSeededApp` would drive a cold packaged binary
          # against dev-build baselines). It is harmless today only by step ORDER, and
          # relying on ordering is what this file has already been bitten by. Outputs
          # are read explicitly by the two steps that want them.
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "install_dir=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # RF_E2E_APP_EXE comes from the install step's OUTPUT and is set in THIS step's
      # `env:` only, so it makes fixtures.findBuiltApp() resolve the INSTALLED app
      # here — beating the job-wide RF_E2E_DEV=1 — while every other step on this leg
      # still gets the dev build it expects.
      # RF_PY is still passed: the spec SEEDS its data root with the host
      # interpreter, then launches the app with MEDIA_STUDIO_PYTHON /
      # MEDIA_STUDIO_SIDECAR_DIR stripped so the app uses its OWN bundled runtime
      # (see the spec header).
      - name: E2E GUI — INSTALLED build cold first-run + data pipeline [Windows, on demand]
        if: ${{ !cancelled() && runner.os == 'Windows' && github.event.inputs.drive_installed_build == 'true' }}
        working-directory: app
        env:
          RF_PY: ${{ steps.setup-python.outputs.python-path }}
          RF_E2E_DEV: "1"
          # 20 minutes. The in-app estimate is ~3 min (FirstRunSetup
          # SETUP_ESTIMATE_MIN) but that is a warm-network developer figure and this
          # window has NEVER been measured on a GitHub runner — UNVERIFIED, which is
          # why it is a variable. The settling experiment is this step's own log: the
          # spec prints the gate phase/detail it timed out on.
          RF_E2E_COLD_TIMEOUT_MS: "1200000"
          RF_E2E_APP_EXE: ${{ steps.install-app.outputs.exe }}
        run: npx playwright test --config playwright.config.ts installed-app

      # ALWAYS uninstall — `always()` here and not `!cancelled()`, unlike the two
      # steps above: cleanup must run even on a cancelled run, or the runner is left
      # with an installed app and a Start-menu shortcut. `|| true` semantics via a
      # guard rather than a suppressed exit: a failure to uninstall is reported in
      # the log but must not turn a green proof red, since the artifact under test
      # has already been measured by then.
      - name: Uninstall the built package [Windows, on demand]
        if: always() && runner.os == 'Windows' && github.event.inputs.drive_installed_build == 'true'
        shell: pwsh
        env:
          # Read from the install step's OUTPUT rather than a job-wide GITHUB_ENV
          # export. Empty when that step was skipped, which the guard below handles.
          RF_E2E_INSTALL_DIR: ${{ steps.install-app.outputs.install_dir }}
        run: |
          $target = $env:RF_E2E_INSTALL_DIR
          if (-not $target -or -not (Test-Path -LiteralPath $target)) {
            Write-Host "nothing to uninstall (RF_E2E_INSTALL_DIR='$target')"
            exit 0
          }
          $uninstaller = Get-ChildItem -Path $target -Filter 'Uninstall *.exe' -File | Select-Object -First 1
          if ($uninstaller) {
            Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
            for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath (Join-Path $target 'Reframe.exe')); $i++) { Start-Sleep -Seconds 2 }
          } else {
            Write-Host "no uninstaller found in $target"
          }
          # Report the residue rather than force-deleting it: a leftover tree is a
          # finding about the uninstaller, and this is an ephemeral runner.
          Write-Host "post-uninstall residue: $((Get-ChildItem -Path $target -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')"

      - name: Upload regenerated visual baselines
        if: always() && runner.os == 'Windows' && github.event.inputs.update_visual_baselines == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: updated-visual-baselines
          # Playwright stores baselines next to each spec (playwright.visual.config.ts
          # testDir: ./e2e/visual) as `<spec>.spec.ts-snapshots/<name>-win32.png`.
          path: app/e2e/visual/**/*-win32.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: e2e-gui-playwright-report-${{ matrix.os }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
          retention-days: 7
