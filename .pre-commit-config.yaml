# Lean quality gates — local auto-fixers + fast checks.
# `pre-commit run --all-files` is the gate-1/gate-5 entrypoint used by CI (quality.yml).
# Every rev is pinned; bump versions here together with QUALITY-CHARTER.md + quality.yml.
minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

exclude: |-
  (?x)^(
    Inspirations\ &\ Former\ Attempts/|
    node_modules/|
    app/node_modules/|
    app/render-cli/node_modules/|
    app/out/|
    app/dist/|
    dist/|
    build/|
    vendor/|
    \.venv/|
    sidecar/\.venv/|
    .*\.egg-info/
  )

repos:
  # --- Gate 1: Python lint + format (ruff 0.15.17) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        args: ["--fix"]
        files: '^sidecar/.*\.py$'
      - id: ruff-format
        name: ruff (format)
        files: '^sidecar/.*\.py$'

  # --- Gate 1: JS/TS lint (oxlint 1.69.0 mirror) ---
  # The `rev:` below is the ONLY oxlint version in the repo and therefore the one
  # `quality.yml` actually runs. This comment used to add "npm pins 1.70.0", which was
  # false — oxlint appears in no tracked package.json — and QUALITY-CHARTER.md repeated
  # that 1.70.0 as the charter's declared version, documenting a tool nothing executes.
  # Both now say 1.69.0. `.quality/charter_check.py` matches gate SLUGS only, so it
  # cannot catch a version drift here; keep this line and the charter in step by hand.
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.69.0
    hooks:
      - id: oxlint
        name: oxlint (app)
        args: ["--config", "app/.oxlintrc.json", "--fix", "--deny-warnings"]
        files: '^app/(main|renderer/src|render-cli/src)/.*\.(ts|tsx|js|jsx)$'

  # --- Gate 1: JS/TS format (Biome 2.5.0, format-only) ---
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.0
    hooks:
      - id: biome-format
        name: biome (format)
        additional_dependencies: ["@biomejs/biome@2.5.0"]
        files: '^app/(main|renderer/src|render-cli/src)/.*\.(ts|tsx|js|jsx|css|json)$'

  # --- Gate 1: documentation anti-drift (stdlib python, no network) ---
  # Deliberately a `repo: local` hook inside gate:1, NOT a new `gate-<slug>` step in
  # quality.yml: QUALITY-CHARTER.md rule 2 declares the 6-gate list closed, and
  # the reverse-direction loop in `.quality/charter_check.py` `main()` requires every
  # `gate-<slug>` step in quality.yml to map to a charter row — a 7th step would breach
  # the rule AND fail that check. (Named, not line-numbered: the W30 fix shifted the
  # `:79-81` anchor this comment used to carry.)
  - repo: local
    hooks:
      - id: docs-check
        name: docs-check (SSOT anti-drift R1-R5)
        entry: python .quality/docs_check.py
        language: system
        pass_filenames: false
        always_run: true

  # --- Gate 1: reachability / dead-module anti-drift (stdlib python, no network) ---
  # W26. Same reasoning as docs-check above for riding INSIDE gate:1 rather than opening
  # a `gate-<slug>` step: QUALITY-CHARTER.md rule 2 declares the 6-gate list closed and
  # the reverse-direction loop in `.quality/charter_check.py` main() would fail a 7th.
  # Coverage cannot see unreachability — an unmounted module still executes under its own
  # test — which is why W16-W20 all shipped 100%-covered and mounted nowhere.
  # The RPC half of W26 needs the LIVE sidecar registry, so it rides gate:3 instead
  # (sidecar/tests/test_reachability_gate.py); both halves read one allowlist.
  - repo: local
    hooks:
      - id: reachability-check
        name: reachability-check (W26 dead-module/dead-waiver)
        entry: python .quality/reachability_check.py
        language: system
        pass_filenames: false
        always_run: true

  # --- Gate 1: Electron packaging hardening (stdlib python, no network) ---
  # W66 — the ASAR-integrity + Node-surface fuses declared in electron-builder.yml.
  # Same gate:1 local-hook reasoning as the two above.
  - repo: local
    hooks:
      - id: electron-hardening-check
        name: electron-hardening-check (W66 ASAR integrity + Node surface + renderer sandbox)
        entry: python .quality/electron_hardening_check.py
        language: system
        pass_filenames: false
        always_run: true

  # --- Gate 5: secrets (gitleaks 8.30.1) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        args: ["--config", ".gitleaks.toml"]
