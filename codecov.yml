codecov:
  require_ci_to_pass: true

flags:
  web:
    paths:
      - apps/
  desktop-ts:
    paths:
      - apps/
  python:
    paths:
      - coverage/
  desktop-rust:
    paths:
      - coverage/

coverage:
  status:
    project:
      default:
        target: 100.0%
        threshold: 0%
    patch:
      default:
        target: 100.0%
        threshold: 0%
