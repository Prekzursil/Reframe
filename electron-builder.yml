# electron-builder.yml — two-stage Windows packaging (CONTRACTS.md A7 / PLAN-P2 T5).
#
# STAGE 1 (this config): a SLIM artifact (< ~700 MB; NSIS has a ~2 GB format
# ceiling anyway): Electron app + render-cli + embeddable CPython 3.12 +
# ffmpeg/ffprobe + the pre-built Remotion bundle + the sidecar SOURCE.
# NO torch, NO heavy wheels, NO models — those install on first run
# (resources/sidecar/runtime_setup/bootstrap.py -> %APPDATA%/media-studio).
#
# Build (human-run; agents never run installs/builds):
#   1. build/python-embed-setup.ps1          # stages build/python-embed + build/ffmpeg/win (network)
#   2. cd app && npm run build               # electron-vite -> app/out
#   3. cd app/render-cli && npm run bundle   # T4a: writes render-cli/out/remotion-bundle
#   4. cd app && npx electron-builder --config ../electron-builder.yml --win
#   4b. node build/sign-release.mjs          # WU-U2: Ed25519-sign each dist/*-win-x64.exe over
#                                            #   version‖sha512 (needs $REFRAME_UPDATE_PRIVATE_KEY)
#                                            #   -> dist/<installer>.sig (the app verifies this)
#   5. build/make-portable.ps1               # optional: zip + slim/size assertions
#   6. publish: electron-builder --publish always, THEN gh release upload v<version> dist/*.sig
#      so the signatures ship alongside the installer + latest.yml on the release.
#
# Paths below are relative to the PROJECT dir (app/), because the build runs
# from app/ with `--config ../electron-builder.yml`.

appId: local.media-studio
productName: Reframe
# WU-U: IN-PLACE AUTO-UPDATE via electron-updater + GitHub Releases. The github
# publish provider makes electron-builder (a) emit `latest.yml` (the update feed
# manifest electron-updater polls) and the NSIS `.blockmap` (enables delta
# downloads — only changed blocks are fetched) alongside the installer, and (b)
# bundle `app-update.yml` INTO the app so a running copy knows where to check.
# OS CODE-SIGNING stays OFF (no CSC): this is an unsigned build, so Windows
# SmartScreen may warn when the downloaded installer runs. AUTHENTICITY is instead
# enforced at the APP layer (WU-U2): build/sign-release.mjs Ed25519-signs each
# installer over `version‖sha512` and the `<installer>.sig` asset is verified against
# the embedded public key before an update is applied (app/main/updateVerify.ts) — so
# a compromised feed cannot ship a forged installer. Publishing is a human/CI step
# (`electron-builder --publish` with a GH_TOKEN, then `gh release upload` for the
# .sig assets); the build itself never auto-uploads.
publish:
  provider: github
  owner: Prekzursil
  repo: Reframe

directories:
  output: ../dist
  buildResources: ../build

# Renderer + main are fully bundled by electron-vite into out/; app node_modules
# are NOT shipped (react lands in the vite bundle). render-cli is its own
# package (T4a) — it ships ENTIRELY via extraResources below (never in asar:
# the sidecar spawns render.js + the native compositor from the real
# filesystem at resources/render-cli/..., the paths WIRING-T4A injects).
files:
  - out/**/*
  - package.json
  - "!render-cli/**"
  - "!node_modules/**"

asar: true

# W66 — ELECTRON FUSES. Compile-time bits flipped in the packaged binary right before
# signing (app-builder-lib platformPackager.js:259-297 in the pinned electron-builder
# 26.15.3, via @electron/fuses 1.8.0). They are the only way to remove a Node-injection
# surface from a shipped Electron app: `webPreferences` hardening (main.ts:1080-1085)
# governs the RENDERER, while these govern the EXECUTABLE.
#
# Every value is stated explicitly rather than left undefined, because an undefined
# entry is SKIPPED by generateFuseConfig — so an omission is silence, not a default,
# and the gate (.quality/electron_hardening_check.py) can only assert what is written.
electronFuses:
  # MUST STAY TRUE. The premium-caption render path spawns the ELECTRON EXE ITSELF as
  # a plain Node process — `[exe, render.js, job.json]` with ELECTRON_RUN_AS_NODE=1
  # (CONTRACTS.md:187, docs/wiring/WIRING-T4A.md:51, app/main/sidecar.ts:154,
  # app/render-cli/package.json:5). `false` is the usual hardening default and it would
  # break every animated caption render in the packaged app. This is the one fuse whose
  # correct value here is the INSECURE-looking one; the gate pins it so a future
  # "harden all the fuses" sweep cannot silently flip it.
  runAsNode: true
  # Cookies at rest are encrypted with the OS credential store.
  enableCookieEncryption: true
  # Close the two remote-code-injection surfaces. Measured before flipping: neither
  # NODE_OPTIONS nor `--inspect` appears in ANY tracked .ts/.py/.json/.yml/.ps1/.mjs
  # file, so nothing in this repo depends on either.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # THE HEADLINE OF W66: the app refuses to run a tampered app.asar. electron-builder
  # computes the asar header hash for non-mac platforms (platformPackager.js:225-232)
  # and this fuse makes Electron VERIFY it at load.
  enableEmbeddedAsarIntegrityValidation: true
  # ...and refuse an unpacked `app/` directory placed beside it, which would otherwise
  # be an integrity bypass by construction. Safe here: `files:` ships out/** +
  # package.json INTO the asar; the extraResources trees (render-cli, python, bin) are
  # spawned as separate processes and are not the app entry point.
  onlyLoadAppFromAsar: true
  # No custom V8 snapshot is built.
  loadBrowserProcessSpecificV8Snapshot: false
  # LEFT AT ELECTRON'S DEFAULT (true), deliberately not hardened. Production loads the
  # renderer from file:// (main.ts:1161 `loadFile`), so flipping this changes what a
  # file:// page may do, and UNVERIFIED whether the mstream:// media path and the
  # renderer's own asset loads survive it — this lane cannot run a packaged build to
  # find out. Settling experiment: set it false, `npx electron-builder --win`, then
  # drive app/e2e/packaged.spec.ts and the preview/media journeys.
  grantFileProtocolExtraPrivileges: true

extraResources:
  # Remotion render CLI (T4a) — layout mirrors the dev tree so the supervisor
  # env vars are just process.resourcesPath + the same relative paths:
  #   MEDIA_STUDIO_RENDER_JS       -> resources/render-cli/dist/render.js
  #   MEDIA_STUDIO_REMOTION_BUNDLE -> resources/render-cli/out/remotion-bundle
  # node_modules carries @remotion/renderer + its native compositor (A4:
  # asar-free by construction here).
  - from: render-cli/dist
    to: render-cli/dist
  - from: render-cli/out/remotion-bundle
    to: render-cli/out/remotion-bundle
  - from: render-cli/node_modules
    to: render-cli/node_modules
  - from: render-cli/package.json
    to: render-cli/package.json
  # Embeddable CPython 3.12 (+ staged get-pip.py) — build/python-embed-setup.ps1
  - from: ../build/python-embed
    to: python
  # Dedicated embeddable CPython 3.14 (+ staged get-pip.py) for the ISOLATED
  # chatterbox voice-clone env — torch 2.10 only resolves on py3.14 (A4).
  # ChatterboxEngine + bootstrap resolve <resources>/python-chatterbox/python.exe.
  - from: ../build/python-embed-314
    to: python-chatterbox
  # Bundled ffmpeg/ffprobe (WU A3) — BtbN win64-**GPL** STATIC exes.
  # PINNED release tag: autobuild-2026-06-30-13-34 / asset
  # ffmpeg-n7.1.5-1-g7d0e842004-win64-gpl-7.1.zip (staged into build/ffmpeg/win/
  # by build/python-embed-setup.ps1 -WithFfmpeg). Ships OUTSIDE app.asar via
  # extraResources -> resources/bin/, resolved by ffmpeg.py's _BUNDLED_DIR and by
  # the MEDIA_STUDIO_FFMPEG/FFPROBE env the supervisor injects (WIRING-T5 §2 /
  # sidecar.ts buildSidecarEnv).
  #
  # CORRECTED 2026-08-08. This block used to pin the win64-**LGPL** asset and call
  # it "redistribution-safe in a closed-source app". The licence claim was true but
  # irrelevant, because that build is configured --disable-libx264 and therefore
  # CANNOT ENCODE H.264 — which the entire app hardcodes. Every export in the
  # shipped build failed with "Unknown encoder 'libx264'". Correcting the pin to
  # GPL is what makes the product work; the reasoning is corrected here rather than
  # deleted so the trade-off is not silently re-litigated back to LGPL.
  #
  # GPL obligation, and why it does NOT reach Reframe's own source: the sidecar
  # spawns these exes as SEPARATE CHILD PROCESSES over argv lists (media_studio/
  # ffmpeg.py resolve_binary + run(); no linking, no shell). That is aggregation,
  # so shipping the unmodified GPL ffmpeg does not relicense Reframe. It DOES
  # oblige an offer of ffmpeg's corresponding source, discharged three ways:
  #   1. the BtbN LICENSE.txt travels beside the exes — VERIFIED, not assumed: the
  #      "*.txt" filter below matches it, and the staged dir contains exactly
  #      ffmpeg.exe / ffprobe.exe / LICENSE.txt (35,147 B of GPL text; the old LGPL
  #      asset's was 7,651 B, so this really is the stronger licence's text);
  #   2. the exact tag + asset + upstream source URL are recorded in
  #      build/python-embed-setup.ps1 and in the user-facing Settings -> Licenses
  #      surface (app/renderer/src/features/ThirdPartyNotices.tsx, FFMPEG_NOTICE);
  #   3. docs/THIRD-PARTY-LICENSES.md carries the written source offer verbatim.
  - from: ../build/ffmpeg/win
    to: bin
    filter:
      - "ffmpeg.exe"
      - "ffprobe.exe"
      - "*.txt"
  # The sidecar SOURCE (pure .py + the verthor WSL script + first-run setup).
  # Python cannot import from asar; ships as plain files under resources/.
  - from: ../sidecar/media_studio
    to: sidecar/media_studio
    filter:
      - "**/*.py"
      - "scripts/**"
      # Vendored model LICENSE files (extensionless) — _lightasd (MIT),
      # _transnetv2, _vinet_s (CC-BY-NC-SA). Attribution completeness, same as
      # ffmpeg's LGPL LICENSE.txt above. Glob is relative to the `from` base
      # (../sidecar/media_studio), so `**/LICENSE` resolves features/*/LICENSE.
      - "**/LICENSE"
  - from: ../sidecar/runtime_setup
    to: sidecar/runtime_setup
    filter:
      - "**/*.py"
      - "requirements-*.txt"
  # Runtime BrowserWindow icon (WU A2). The .ico is embedded into the exe by
  # win.icon above, but the running window loads a PNG via nativeImage; ship the
  # 512px master (+ the .ico as a fallback) to resources/icons/, resolved by
  # main.ts resolveWindowIcon() as process.resourcesPath/icons/reframe-512.png.
  - from: ../build/icons
    to: icons
    filter:
      - "reframe-512.png"
      - "reframe.ico"
win:
  # App icon (WU A2 — Concept A "Crop Pull"): the multi-size .ico (16/24/32/48/
  # 64/128/256, PNG-embedded) is the exe + taskbar icon. Path is relative to
  # buildResources (../build), i.e. ../build/icons/reframe.ico.
  icon: icons/reframe.ico
  # Two targets per T5: NSIS installer + portable zip (both slim).
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${name}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Installer + uninstaller chrome icon (WU A2). Same buildResources-relative
  # .ico as win.icon — replaces the default Electron icon everywhere.
  installerIcon: icons/reframe.ico
  uninstallerIcon: icons/reframe.ico
  # WU-I1: the COMPONENT PAGE. buildResources-relative (../build/installer.nsh).
  # Adds an nsDialogs page at electron-builder's `customPageAfterChangeDir` hook —
  # Minimum / Default / Full / Custom with individually selectable feature packs —
  # and writes the choice as `$INSTDIR/.first-run-profile.json`. The app adopts that
  # seed into its runtime-resolved data root on first launch (app/main/installerSeed.ts),
  # so setup provisions the chosen packs UNATTENDED instead of re-asking in the in-app
  # ProfilePicker. NO model bytes are bundled — the packs are asset names routed to
  # bootstrap.py `--assets`, and the weights still download on demand (the NSIS ~2 GB
  # ceiling noted at the top of this file is exactly why).
  # The ids/labels in that .nsh are pinned against app/main/installProfiles.ts by
  # app/main/installerSeed.test.ts, so the page and the app cannot drift apart.
  include: installer.nsh
  # KEEP FALSE. This switch is not the data-root question and never was — when it is
  # true, app-builder-lib's uninstaller wipes %APPDATA%/<app> on a non-update uninstall
  # (templates/nsis/uninstaller.nsh:223-248) and NOTHING ELSE. The data root (library,
  # projects, envs/models/tools) lives at %APPDATA%/media-studio or wherever
  # data-dir.txt points, so flipping this would still strand every GB that matters
  # while making an interrupted upgrade riskier.
  #
  # WU-L7 answers the real question in the right place instead: the same installer.nsh
  # now exports `customUnWelcomePage` + `customUnInstall`, which put a keep-vs-remove
  # page in front of the user with the reclaimable size measured live. Both offers
  # DEFAULT TO KEEP, an explicit tick on a visible page is the only thing that deletes
  # anything, and a silent / `--updated` run (i.e. every in-place auto-update) can never
  # reach the delete branch.
  deleteAppDataOnUninstall: false
  # DO NOT SET `removeDefaultUninstallWelcomePage`. It reads like "drop MUI's welcome
  # page", but assistedInstaller.nsh:66 wraps the WHOLE `!ifmacrodef customUnWelcomePage`
  # block in `!ifndef removeDefaultUninstallWelcomePage` — so setting it silently deletes
  # the WU-L7 keep-vs-remove page and restores the stranded-data-root behaviour with no
  # error anywhere. app/main/installerSeed.test.ts asserts it stays unset.
  shortcutName: Reframe

# Nothing native to rebuild in the app package itself (natives live in
# render-cli's own node_modules, shipped as-is, and in the first-run envs).
npmRebuild: false
nodeGypRebuild: false
electronLanguages: [en-US]
compression: normal
