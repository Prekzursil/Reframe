name: Fullstack Web CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: fullstack-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=xml:coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: ui
        run: npm ci
      - name: Run frontend tests with coverage
        working-directory: ui
        run: npx vitest run --coverage

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run integration suite
        shell: bash
        run: |
          python -m venv .venv
.venv/bin/python -m pip install --upgrade pip
.venv/bin/pip install -r apps/api/requirements.txt -r services/worker/requirements.txt
.venv/bin/pip install pytest pytest-cov
npm --prefix apps/web ci
npm --prefix apps/desktop ci
mkdir -p coverage
PYTHONPATH=.:apps/api:packages/media-core/src .venv/bin/python -m pytest \
  --cov=apps/api/app \
  --cov=services/worker \
  --cov=packages/media-core/src/media_core \
  --cov-branch \
  --cov-report=xml:coverage/python-coverage.xml \
  apps/api/tests services/worker packages/media-core/tests
npm --prefix apps/web run test:coverage
npm --prefix apps/desktop run test:coverage
cargo install cargo-llvm-cov --locked
(cd apps/desktop/src-tauri && cargo llvm-cov --workspace --all-features --lcov --output-path ../../../coverage/desktop-rust.lcov)
